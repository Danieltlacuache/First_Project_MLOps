name: annotation-portal

# Docker levanta SOLO la infraestructura (base de datos + almacenamiento).
# La app Next.js corre en tu máquina con npm:
#   npm run dev    → http://localhost:3000  (BD annotation_portal_dev)
#   npm run prod   → http://localhost:3100  (BD annotation_portal_prod)

services:
  # ── MariaDB: dos bases de datos, dev y prod, en el mismo servidor ─────
  mariadb:
    image: mariadb:11.4
    container_name: ap-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: annotation_portal_dev
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      TZ: America/Mexico_City
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      # Crea también la BD de producción y da permisos al usuario de la app
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # ── MinIO: archivos de imagen ─────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: ap-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT:-9000}:9000"                 # API S3
      - "${MINIO_CONSOLE_PORT:-9001}:9001"         # Consola web
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # ── Job de un solo uso: crea los buckets dev y prod, y se apaga ───────
  minio-init:
    image: minio/mc:latest
    container_name: ap-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/images-dev &&
      mc mb --ignore-existing local/images-prod &&
      echo '>>> buckets listos: images-dev, images-prod'
      "

volumes:
  mariadb_data:
  minio_data:
